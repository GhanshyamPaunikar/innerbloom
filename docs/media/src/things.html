<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body { width: 1280px; height: 720px; }
  header { position: absolute; top: 42px; width: 100%; text-align: center; }
  header h2 { font-size: 58px; }
  header .mono { margin-top: 10px; }
  .grid { position: absolute; left: 58px; right: 58px; top: 182px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .card { height: 200px; padding: 20px 20px 18px; color: var(--soft); }
  .card h3 { font-size: 18px; font-weight: 500; margin: 18px 0 8px; color: #a4968a; }
  .card p { font-size: 13.5px; line-height: 1.45; color: #b3a596; }
  .card .out { margin-top: 12px; display: inline-block; font-size: 12px; padding: 4px 10px; border-radius: 999px;
               background: var(--charcoal); color: #fffaf2; opacity: 0; }
  .card.on { color: var(--orange); }
  .card.on h3 { color: var(--ink); }
  .card.on p { color: #5f564b; }
  .caption { position: absolute; bottom: 38px; width: 100%; text-align: center; }
</style></head>
<body>
  <div class="glow" style="width:600px;height:300px;left:340px;top:-120px;background:#fff6ea"></div>
  <header><h2 class="title">Write. It reads you back.</h2><div class="mono">Ten things your journal starts doing</div></header>
  <div class="grid" id="grid"></div>
  <div class="caption"><span class="chip"><b id="n">01</b><span id="cap"></span></span></div>
<script>
  const I = {
    feel: '<path d="M12 21s-7-4.4-9.3-9A5.3 5.3 0 0 1 12 6a5.3 5.3 0 0 1 9.3 6c-2.3 4.6-9.3 9-9.3 9z"/>',
    chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    cite: '<path d="M7 7h10M7 12h10M7 17h6"/><rect x="3" y="3" width="18" height="18" rx="3"/>',
    split: '<path d="M8 3v6a4 4 0 0 0 8 0V3M12 13v8"/>',
    bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
    radar: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/>',
    book: '<path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6"/><path d="M20 4v14h-6"/>',
    map: '<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="10" cy="18" r="2.5"/><path d="M8 7l7.5 1M7 8l2 8M12 17l4.5-7"/>',
    people: '<circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0M16 4a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  };
  const THINGS = [
    ["feel", "Feeling and intensity", "“Work was heavy today, but I kept the laptop closed.”", "frustrated · 6/10",
     "Every entry is read once: feeling, intensity, themes and people."],
    ["chat", "Ask your journal", "“What has been draining me lately?”", "searching 6 entries",
     "Ask anything. An agent searches your past entries before it answers."],
    ["cite", "Answers with sources", "Each reply links the entries it used.", "Oct 21 · Oct 27",
     "Every claim cites the exact entries it drew from. Click to open them."],
    ["split", "Contradictions", "Said: no email after 9pm. Did: checked it at 11.", "said vs did",
     "It notices when what you said and what you did drifted apart."],
    ["bolt", "Triggers", "Runs with Sam lift you. Launch weeks drain you.", "lifts · drains",
     "What reliably lifts your mood, and what reliably drains it."],
    ["radar", "Wellbeing radar", "Burnout and spiral signs, early.", "burnout: watch",
     "Early, gentle warnings when burnout or a low spiral starts building."],
    ["book", "Your story", "Who you are becoming, in your own words.", "3 arcs",
     "The story you have been living: values, tensions, who you are becoming."],
    ["map", "Memory map", "Entries grouped by the themes they share.", "8 groups",
     "A map of your memories. Follow one thread through weeks of writing."],
    ["people", "People", "Who you write about, and when to check in.", "Jane · 6 mentions",
     "Everyone you mention, how they make you feel, and when to reach out."],
    ["clock", "A month ago today", "Then and now, side by side.", "then → now",
     "A month later: what stayed, what shifted, what you are still avoiding."],
  ];
  const grid = document.getElementById("grid");
  THINGS.forEach(([icon, title, quote, out]) => {
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = `<svg class="icon" viewBox="0 0 24 24">${I[icon]}</svg><h3>${title}</h3><p>${quote}</p><span class="out">${out}</span>`;
    grid.appendChild(c);
  });
  const STEP = 1.7, DURATION = STEP * THINGS.length;
  const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
  function render(t) {
    const k = Math.floor(t / STEP) % THINGS.length, local = t - Math.floor(t / STEP) * STEP;
    [...grid.children].forEach((c, i) => {
      c.classList.toggle("on", i === k);
      c.querySelector(".out").style.opacity = i === k ? ease((local - 0.35) / 0.3) : 0;
    });
    document.getElementById("n").textContent = String(k + 1).padStart(2, "0");
    document.getElementById("cap").textContent = THINGS[k][4];
  }
  render(0);
</script>
</body></html>
